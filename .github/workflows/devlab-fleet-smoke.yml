# DevLab controlled source/test smoke workflow. Triggered only by Y-afes exact-titled Issues.
# It does not run commands supplied in Issue bodies, access signing keys or transmit RF.
name: DevLab source checks (local preferred)
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: devlab-smoke-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      ${{ github.event.issue.user.login == 'Y-afes' &&
          (github.event.issue.title == '[DevLab] Kontrol' ||
           github.event.issue.title == '[DevLab Cloud] Kontrol') }}
    runs-on: ubuntu-latest
    outputs:
      runner_json: ${{ steps.select.outputs.runner_json }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - id: select
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          LAST_SEEN: ${{ vars.DEVLAB_LAST_SEEN }}
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          active=false
          if [[ "$LAST_SEEN" =~ ^[0-9]+$ ]] &&
             (( now >= LAST_SEEN )) && (( now - LAST_SEEN < 260 )); then
            active=true
          fi
          if [[ "$ISSUE_TITLE" == '[DevLab Cloud] Kontrol' ]]; then
            active=false
          fi
          echo 'runner_json="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          echo 'mode=cloud' >> "$GITHUB_OUTPUT"
          echo 'This repository is cloud-only (macOS required or public repository).'

  check:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner_json) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Project checks (public-web)
        shell: bash
        env:
          DEVLAB_PROFILE: public-web
        run: |
          set -euo pipefail
          # Shared system-wide build lock for multiple private repositories.
          if [[ "${{ runner.environment }}" == 'self-hosted' ]]; then
            exec 9>/home/devlab-ci/fleet/.build.lock
            flock -w 1800 9 || { echo 'Timed out waiting for local DevLab lock'; exit 1; }
          fi
          echo 'DevLab profile:' "$DEVLAB_PROFILE"
          mkdir -p out
          : > out/results.txt
          echo "Repo: $GITHUB_REPOSITORY" >> out/results.txt
          echo "Runner: ${{ runner.environment }}" >> out/results.txt
          echo "Profile: $DEVLAB_PROFILE" >> out/results.txt
          # Syntax checks use only repository-owned scripts on a trusted default branch.
          if [[ -d scripts ]]; then
            find scripts -type f -name '*.sh' -exec bash -n {} \;
          fi
          case "$DEVLAB_PROFILE" in
            kotlin)
              if [[ "${{ runner.environment }}" == 'self-hosted' ]]; then
                export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
              fi
              chmod +x ./gradlew
              ./gradlew :app:classes --no-daemon --max-workers=2
              echo 'Kotlin JVM compilation passed.' >> out/results.txt
              ;;
            android)
              if [[ "${{ runner.environment }}" == 'self-hosted' ]]; then
                export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
                export ANDROID_HOME=/opt/devlab/android-sdk
              else
                sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
              fi
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug --no-daemon --max-workers=2
              apk=app/build/outputs/apk/debug/app-debug.apk
              test -s "$apk"
              cp "$apk" out/android-debug.apk
              (cd out && sha256sum android-debug.apk > SHA256SUMS.txt)
              echo 'Android debug APK assembled.' >> out/results.txt
              ;;
            ios)
              xcodebuild -version | tee -a out/results.txt
              swift --version | tee -a out/results.txt
              echo 'macOS toolchain discovery only; full Xcode tests not run.' >> out/results.txt
              ;;
            python|office|security)
              if [[ -d scripts ]]; then
                python3 -m compileall -q scripts
              fi
              find . -maxdepth 2 -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 -r -n 1 python3 -m py_compile
              echo 'Python syntax checks passed; runtime dependencies not validated.' >> out/results.txt
              ;;
            web|public-web)
              if command -v php >/dev/null 2>&1; then
                find . -maxdepth 3 -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l >/dev/null
              fi
              echo 'Website source sanity check completed; browser/deployment not tested.' >> out/results.txt
              ;;
            electronics)
              if command -v kicad-cli >/dev/null 2>&1; then kicad-cli version >> out/results.txt; fi
              echo 'Script syntax checked; ERC/DRC and hardware fabrication validation not run.' >> out/results.txt
              ;;
            shell)
              echo 'Shell syntax check completed; toolchain build/hardware not tested.' >> out/results.txt
              ;;
            *) echo 'Unsupported profile'; exit 2 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: devlab-${{ github.event.issue.number }}-${{ needs.route.outputs.mode }}
          path: out/
          retention-days: 7
      - name: Comment on request
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CHECK_STATUS: ${{ job.status }}
          MODE: ${{ needs.route.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "DevLab smoke check: **$CHECK_STATUS** | Executor: **$MODE**. [Run and artifacts]($RUN_URL). Runtime/hardware checks vary by repository."
